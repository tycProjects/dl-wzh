# apk-builder Flutter workflow — version: 12
# Auto-generated by flutterBuilder.js in apk-builder.
# Do not edit directly — this file is overwritten on every Flutter build.
name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Flutter's Gradle plugin (via android/settings.gradle.kts) requires JDK 17+.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Auto-generated release keystore: created once per requester
      # (scoped by keystoreCacheKey, derived from clientId in server.js) and
      # cached across builds so every APK from the same person carries the
      # same signature — required for Android to accept update installs.
      - name: Restore release signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/release-keystore
          key: release-keystore-914028de00a420fb4849403f-v1

      - name: Generate release signing key (first build only)
        run: |
          mkdir -p ~/.android/release-keystore
          if [ ! -f ~/.android/release-keystore/release.jks ]; then
            echo "No cached signing key for this requester — generating a new one."
            PASS=$(openssl rand -hex 20)
            echo -n "$PASS" > ~/.android/release-keystore/release.pass
            keytool -genkeypair -v \
              -keystore ~/.android/release-keystore/release.jks \
              -alias release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=App Builder, OU=Apps, O=Tycept, C=US"
          else
            echo "Reusing cached signing key for this requester."
          fi

      - name: Print release signing fingerprint
        run: |
          FINGERPRINT=$(keytool -list -v \
            -keystore ~/.android/release-keystore/release.jks \
            -storepass "$(cat ~/.android/release-keystore/release.pass)" \
            -alias release 2>/dev/null | grep "SHA256:" | sed 's/^[[:space:]]*SHA256:[[:space:]]*//')
          echo "---- SHA-256 fingerprint (for assetlinks.json if needed) ----"
          echo "${FINGERPRINT:-<not found — check keytool output above>}"
          echo "--------------------------------------------------------------"

      - name: Locate Flutter project and install dependencies
        run: |
          # Find the pubspec.yaml nearest the repo root — this is the project
          # root, NOT the android/ subfolder (which has its own build.gradle
          # but is orphaned from lib/ if used as the working directory).
          PUBSPEC=$(find "$GITHUB_WORKSPACE" -maxdepth 5 -name pubspec.yaml \
            -not -path '*/.git/*' -not -path '*/node_modules/*' \
            -not -path '*/build/*' | sort | head -n1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::No pubspec.yaml found. Upload a Flutter project zip (the folder containing pubspec.yaml, lib/, etc.)."
            exit 1
          fi
          PROJ=$(dirname "$PUBSPEC")
          echo "Flutter project root: $PROJ"
          echo "FLUTTER_PROJECT=$PROJ" >> "$GITHUB_ENV"
          cd "$PROJ"
          # If android/ wasn't part of the upload (a plain lib/ + pubspec.yaml
          # zip, no platform folders), "flutter build apk" has nothing to build
          # against -- there's no Gradle project at all yet. "flutter create ."
          # fills in ONLY what's missing (android/, plus the other platform
          # folders/.gitignore/analysis_options.yaml if absent); it does not
          # touch or overwrite an existing lib/, pubspec.yaml, or an
          # already-present android/ folder, so this is a safe no-op on a
          # complete upload and a real fix on an incomplete one.
          GENERATED_ANDROID=0
          if [ ! -d "android" ]; then
            echo "No android/ folder in the upload -- generating the missing Flutter platform scaffolding."
            flutter create --platforms=android --org com.tycept.generated .
            GENERATED_ANDROID=1
          fi
          # Set the real package name (applicationId) instead of com.tycept.generated.<name>.
          # An uploaded project's own android/ keeps its id unless a package suffix was typed.
          if [ "$GENERATED_ANDROID" = "1" ] || [ "1" = "1" ]; then
            for G in android/app/build.gradle android/app/build.gradle.kts; do
              if [ -f "$G" ]; then
                sed -i -E 's/applicationId[[:space:]]*=?[[:space:]]*"[^"]*"/applicationId = "com.wzh.builder"/' "$G"
                echo "Package name set to com.wzh.builder in $G"
              fi
            done
          fi
          # flutter create only declares INTERNET in the debug/profile manifests, so a
          # release APK has no network access at all (every request fails with
          # "Failed host lookup"). Add it to the main manifest when it is missing.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
            echo "Added INTERNET permission to $MANIFEST"
          fi
          # The in-app gallery picker (photo_manager) needs the photo permission in the manifest.
          if [ -f "$MANIFEST" ] && grep -q "photo_manager" pubspec.yaml && ! grep -q "READ_MEDIA_IMAGES" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <application|' "$MANIFEST"
            echo "Added photo permissions to $MANIFEST"
          fi
          # Installing the finished APK from inside the app (open_filex) needs this permission, and
          # saving into Downloads on Android 9 and older needs the legacy write permission.
          if [ -f "$MANIFEST" ] && grep -q "open_filex" pubspec.yaml && ! grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <application|' "$MANIFEST"
            echo "Added install-packages permission to $MANIFEST"
          fi
          # This app's own dark launch screen: no white flash before the first frame.
          if grep -q "^name: wzh_apk" pubspec.yaml; then
            for LB in android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml; do
              if [ -f "$LB" ]; then
                sed -i -E 's|<item android:drawable="[^"]*" */>|<item><color android:color="#111111"/></item>|' "$LB"
                echo "Dark launch background set in $LB"
              fi
            done
            # App name under the launcher icon: "WZH 2 APK" instead of the project name wzh_apk.
            if [ -f "$MANIFEST" ]; then
              sed -i -E 's|android:label="[^"]*"|android:label="WZH 2 APK"|' "$MANIFEST"
              echo "App label set to WZH 2 APK in $MANIFEST"
            fi
            # Launcher icon (the package-box logo), shipped in tool/icons/.
            for D in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              if [ -f "tool/icons/$D.png" ] && [ -d "android/app/src/main/res/mipmap-$D" ]; then
                cp "tool/icons/$D.png" "android/app/src/main/res/mipmap-$D/ic_launcher.png"
                echo "Launcher icon set for $D"
              fi
            done
            ST=android/app/src/main/res/values/styles.xml
            if [ -f "$ST" ] && ! grep -q "windowSplashScreenBackground" "$ST"; then
              sed -i -E 's|<style name="LaunchTheme"([^>]*)>|<style name="LaunchTheme"\1>\n        <item name="android:windowSplashScreenBackground">#111111</item>|' "$ST"
              echo "Dark splash background set in $ST"
            fi
          fi
          # Project-supplied Android tweaks (app name, icon, media permissions, minSdk), if the project ships a patch_android.py.
          if [ -f patch_android.py ]; then
            python3 patch_android.py || echo "patch_android.py failed - continuing without it"
          fi
          flutter pub get

      - name: Write android/key.properties for Flutter Gradle signing
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          mkdir -p android
          KS="$HOME/.android/release-keystore/release.jks"
          PASS="$(cat $HOME/.android/release-keystore/release.pass)"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' \
            "$KS" "$PASS" "$PASS" > android/key.properties
          echo "Written android/key.properties (storeFile=$KS)"

      - name: Set up Google services (google-services.json / Web client ID)
        working-directory: ${{ env.FLUTTER_PROJECT }}
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GSJSON_MVLKY1ET21D9D7F3 }}
          GOOGLE_WEB_CLIENT_ID: ''
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
            echo "Restored uploaded google-services.json"
          elif [ -f tycept-google-services.json ]; then
            mv tycept-google-services.json android/app/google-services.json
            echo "Using staged google-services.json"
          fi
          rm -f tycept-google-services.json
          cat > /tmp/google_setup.py <<'PYEOF'
          # Wires google-services.json / a pasted Web Client ID into a Flutter project's android/ folder.
          # Every step is best-effort: a problem here prints a warning, it never fails the build.
          import json, os, re, sys
          from xml.sax.saxutils import escape

          GS = 'android/app/google-services.json'
          CLIENT_ID = os.environ.get('GOOGLE_WEB_CLIENT_ID', '').strip()
          PLUGIN_ID = 'com.google.gms.google-services'

          def read(p):
              with open(p, encoding='utf-8') as f:
                  return f.read()

          def write(p, s):
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(s)

          def first(*paths):
              for p in paths:
                  if os.path.isfile(p):
                      return p
              return None

          app_gradle = first('android/app/build.gradle.kts', 'android/app/build.gradle')
          if not app_gradle:
              print('::warning::No android/app/build.gradle found - skipping Google services setup')
              sys.exit(0)
          settings = first('android/settings.gradle.kts', 'android/settings.gradle')
          root = first('android/build.gradle.kts', 'android/build.gradle')
          app_src = read(app_gradle)
          settings_src = read(settings) if settings else ''
          root_src = read(root) if root else ''

          # ---- 1. google-services.json: validate, make the package name match ----------
          has_json = False
          has_web_client = False
          if os.path.isfile(GS):
              try:
                  data = json.loads(read(GS))
                  if not isinstance(data.get('client'), list) or not data['client']:
                      raise ValueError('no client array')
                  has_json = True
              except Exception as e:
                  print('::warning::android/app/google-services.json is not a usable google-services.json (%s) - ignoring it' % e)

          if has_json:
              m = re.search(r'applicationId\s*=?\s*["\']([^"\']+)["\']', app_src)
              app_id = m.group(1) if m else None
              pkgs = []
              for c in data['client']:
                  p = (c.get('client_info') or {}).get('android_client_info', {}).get('package_name')
                  if p:
                      pkgs.append(p)
              if app_id and pkgs and app_id not in pkgs:
                  try:
                      clone = json.loads(json.dumps(data['client'][0]))
                      clone['client_info']['android_client_info']['package_name'] = app_id
                      data['client'].append(clone)
                      write(GS, json.dumps(data, indent=2))
                      print('Notice: google-services.json is registered for %s but this app is %s - added a matching entry so the build passes. '
                            'Google sign-in/push only fully work if your Firebase app uses exactly %s.' % (', '.join(pkgs), app_id, app_id))
                  except Exception as e:
                      print('::warning::Could not adjust google-services.json package name (%s)' % e)
              has_web_client = any(o.get('client_type') == 3 for c in data['client'] for o in (c.get('oauth_client') or []))

          # ---- 2. apply the google-services Gradle plugin ------------------------------
          def agp_major():
              for src in (settings_src, root_src):
                  m = re.search(r'com\.android\.(?:application|library)["\']\)?\s*version\s*["\'](\d+)\.', src) or \
                      re.search(r'com\.android\.tools\.build:gradle:(\d+)\.', src)
                  if m:
                      return int(m.group(1))
              return 0

          if has_json:
              ver = '4.5.0' if agp_major() >= 9 else '4.4.4'
              kts_app = app_gradle.endswith('.kts')
              kts_settings = bool(settings) and settings.endswith('.kts')
              kts_root = bool(root) and root.endswith('.kts')
              try:
                  if PLUGIN_ID in app_src:
                      print('google-services plugin already applied in the app module - leaving it alone')
                  elif 'dev.flutter.flutter-plugin-loader' in settings_src:
                      # Newer Flutter template: plugins are declared in settings.gradle(.kts).
                      if PLUGIN_ID not in settings_src:
                          line = ('    id("%s") version "%s" apply false' if kts_settings else '    id "%s" version "%s" apply false') % (PLUGIN_ID, ver)
                          new, n = re.subn(r'^(plugins\s*\{[^\n]*\n)', lambda mm: mm.group(1) + line + '\n', settings_src, count=1, flags=re.M)
                          if n != 1:
                              raise RuntimeError('could not find the plugins block in %s' % settings)
                          write(settings, new)
                      line = ('    id("%s")' if kts_app else '    id "%s"') % PLUGIN_ID
                      # Safest spot: right after the Android application plugin line.
                      new, n = re.subn(r'^([^\n]*com\.android\.application[^\n]*\n)', lambda mm: mm.group(1) + line + '\n', app_src, count=1, flags=re.M)
                      if n != 1:
                          new, n = re.subn(r'^(plugins\s*\{[^\n]*\n)', lambda mm: mm.group(1) + line + '\n', app_src, count=1, flags=re.M)
                      if n != 1:
                          raise RuntimeError('could not find the plugins block in %s' % app_gradle)
                      write(app_gradle, new)
                      print('Applied google-services plugin %s (plugins block)' % ver)
                  else:
                      # Older Flutter template: buildscript classpath + apply plugin.
                      if root and PLUGIN_ID not in root_src and 'com.google.gms:google-services' not in root_src:
                          cp = ('classpath("com.google.gms:google-services:%s")' if kts_root else "classpath 'com.google.gms:google-services:%s'") % ver
                          new, n = re.subn(r'^([ \t]*)(classpath\b)', lambda mm: mm.group(1) + cp + '\n' + mm.group(1) + mm.group(2), root_src, count=1, flags=re.M)
                          if n != 1:
                              raise RuntimeError('could not find a buildscript classpath line in %s' % root)
                          write(root, new)
                      apply_line = 'apply(plugin = "%s")' % PLUGIN_ID if kts_app else "apply plugin: '%s'" % PLUGIN_ID
                      write(app_gradle, app_src.rstrip('\n') + '\n\n' + apply_line + '\n')
                      print('Applied google-services plugin %s (classpath)' % ver)
              except Exception as e:
                  print('::warning::Could not wire up the google-services Gradle plugin automatically (%s). Firebase/Google sign-in may not work in this build.' % e)

          # ---- 3. pasted Web Client ID -> default_web_client_id string -----------------
          if CLIENT_ID:
              if has_web_client:
                  print('google-services.json already carries a Web client ID - the pasted one is not needed')
              else:
                  res_dir = 'android/app/src/main/res/values'
                  exists = False
                  if os.path.isdir(res_dir):
                      for fn in os.listdir(res_dir):
                          if fn.endswith('.xml') and 'name="default_web_client_id"' in read(os.path.join(res_dir, fn)):
                              exists = True
                  if exists:
                      print('default_web_client_id is already defined in the project - leaving it alone')
                  else:
                      os.makedirs(res_dir, exist_ok=True)
                      write(os.path.join(res_dir, 'tycept_google.xml'),
                            '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="default_web_client_id" translatable="false">%s</string>\n</resources>\n' % escape(CLIENT_ID))
                      print('Added default_web_client_id from the pasted Client ID')
          PYEOF
          python3 /tmp/google_setup.py

      # flutter-action exports FLUTTER_ROOT but the Flutter Gradle plugin reads
      # flutter.sdk from local.properties instead — without this the Gradle
      # settings evaluation fails with "flutter.sdk not set in local.properties"
      # even with Flutter installed on the runner.
      - name: Write local.properties (Flutter SDK + Android SDK paths)
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          mkdir -p android
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" \
            > android/local.properties

      # AGP 9 compatibility for existing Flutter apps/plugins.
      # AGP 9 defaults to the new DSL and built-in Kotlin, while many
      # existing Flutter projects/plugins still apply kotlin-android and
      # use legacy AGP APIs. Without these flags the Flutter Gradle plugin
      # can fail with ApplicationExtensionImpl -> BaseExtension casts.
      - name: Force Flutter AGP 9 compatibility mode
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          mkdir -p android
          touch android/gradle.properties
          sed -i '/^[[:space:]]*android.builtInKotlin[[:space:]]*=/d' android/gradle.properties
          sed -i '/^[[:space:]]*android.newDsl[[:space:]]*=/d' android/gradle.properties
          printf '\nandroid.builtInKotlin=false\nandroid.newDsl=false\n' >> android/gradle.properties
          echo 'Effective Flutter AGP compatibility flags:'
          grep -E '^android.(builtInKotlin|newDsl)=' android/gradle.properties

      # Some plugins (e.g. media_store_plus) are compiled against android-33 but pull in
      # AndroidX libs that need compileSdk 34+, which fails checkReleaseAarMetadata.
      # Force every plugin module to compile against SDK 36. The hook is PREPENDED to the
      # root android/build.gradle(.kts) so it registers before ":app" gets evaluated.
      - name: Force compileSdk 36 for all plugins
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          if [ -f android/build.gradle.kts ]; then
            F=android/build.gradle.kts
            cat > /tmp/sdkfix.txt <<'EOF'
          // Added by apk-builder: force compileSdk 36 on all plugin modules.
          subprojects {
              afterEvaluate {
                  val ext = extensions.findByName("android")
                  if (ext is com.android.build.gradle.BaseExtension) {
                      ext.compileSdkVersion(36)
                  }
              }
          }

          EOF
          else
            F=android/build.gradle
            cat > /tmp/sdkfix.txt <<'EOF'
          // Added by apk-builder: force compileSdk 36 on all plugin modules.
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android.compileSdkVersion 36
                  }
              }
          }

          EOF
          fi
          if ! grep -q "force compileSdk 36" "$F"; then
            cat /tmp/sdkfix.txt "$F" > /tmp/root-build.new && mv /tmp/root-build.new "$F"
          fi
          echo "Patched $F:"
          head -n 12 "$F"

      # The notification plugin (flutter_local_notifications) needs the notification permission
      # in the manifest and core library desugaring in the app module. Runs only for projects that
      # ship tool/android_setup.py and use the plugin, so other Flutter uploads build as before.
      - name: Prepare Android for notifications
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          if [ -f tool/android_setup.py ] && grep -q "flutter_local_notifications" pubspec.yaml; then
            python3 tool/android_setup.py android
          fi

      - name: Build Flutter APK
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-number=1792796833

      - name: Verify APK exists
        working-directory: ${{ env.FLUTTER_PROJECT }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at $APK — check the flutter build output above."
            # Also search broadly for any .apk in case the output path changed.
            find build -name "*.apk" 2>/dev/null | head -n5
            exit 1
          fi
          echo "APK ready: $(du -sh "$APK" | cut -f1) — $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.FLUTTER_PROJECT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload signing key (save this — future updates must use it)
        uses: actions/upload-artifact@v4
        with:
          name: flutter-signing-key-${{ github.run_id }}
          path: ~/.android/release-keystore/release.jks
          if-no-files-found: warn
          retention-days: 90
