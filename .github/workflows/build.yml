name: Build HTML to APK app

# Runs on every upload, or by hand: Actions tab -> Build HTML to APK app -> Run workflow.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Builds :template (the offline WebView app) and embeds it in :builder (the wizard app).
      - name: Build
        run: gradle :builder:assembleDebug --stacktrace

      - name: Name the APK
        run: cp builder/build/outputs/apk/debug/builder-debug.apk HtmlToApk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HtmlToApk
          path: HtmlToApk.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HTML to APK build ${{ github.run_number }}
          files: HtmlToApk.apk
