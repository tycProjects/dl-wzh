plugins { id 'com.android.application' }
android {
    namespace 'com.pb.browser'
    compileSdk 34
    defaultConfig {
        applicationId 'com.pb.browser'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.8.0' }
