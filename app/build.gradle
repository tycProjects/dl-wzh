plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.meloza.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meloza.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        resourceConfigurations += ['en', 'ru', 'uk']
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}

dependencies {
    implementation 'androidx.compose.ui:ui:1.8.1'
    implementation 'androidx.compose.ui:ui-graphics:1.8.1'
    implementation 'androidx.compose.ui:ui-unit:1.8.1'
    implementation 'androidx.compose.ui:ui-text:1.8.1'
    implementation 'androidx.compose.runtime:runtime:1.8.1'
    implementation 'androidx.compose.runtime:runtime-saveable:1.8.1'
    implementation 'androidx.compose.foundation:foundation:1.8.1'
    implementation 'androidx.compose.foundation:foundation-layout:1.8.1'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.compose.animation:animation:1.8.1'
    implementation 'androidx.compose.animation:animation-core:1.8.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.navigation:navigation-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.core:core-ktx:1.16.0'

    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-session:1.7.1'
    implementation 'androidx.media3:media3-ui:1.7.1'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'


    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
