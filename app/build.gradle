plugins { id 'com.android.application' }

android {
    namespace 'com.promptdrop.ragedemo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.promptdrop.ragedemo'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
}
