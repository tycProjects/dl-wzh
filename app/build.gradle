plugins {
    id 'com.android.application'
}

android {
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace 'com.example.proxylite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.proxylite'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
}
