apply plugin: 'com.android.application'

android {
    namespace 'com.generated.party2'
    compileSdk 34

    defaultConfig {
        applicationId "com.generated.party2"
        minSdk 21
        targetSdk 34
        versionCode 1792107995
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // ABI splits disabled: only produce the single "fat" universal APK
    // (bundles all architectures) instead of also generating the four
    // per-ABI variants. pickDefaultApkEntry in server.js already prefers
    // the universal APK when one exists, so nothing downstream needs to
    // change -- there's just only one file to find now.
    splits {
        abi {
            enable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Lets MainActivity inject the showOpenFilePicker polyfill via
    // WebViewCompat.addDocumentStartJavaScript on devices whose WebView
    // supports it -- a real guarantee the script runs before the page's
    // own scripts, instead of the onPageStarted best-effort fallback
    // (which can't promise it runs first on every device/WebView version).
    implementation 'androidx.webkit:webkit:1.12.1'
}
