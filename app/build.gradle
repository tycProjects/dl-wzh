apply plugin: 'com.android.application'

android {
    namespace 'com.khalifatopup'
    compileSdk 34

    defaultConfig {
        applicationId "com.khalifatopup"
        minSdk 21
        targetSdk 34
        versionCode 1793851551
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // ABI splits disabled: only produce the single "fat" universal APK
    // (bundles all architectures) instead of also generating the four
    // per-ABI variants. pickDefaultApkEntry in server.js already prefers
    // the universal APK when one exists, so nothing downstream needs to
    // change -- there's just only one file to find now.
    splits {
        abi {
            enable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Gradle's default output filenames are the module + ABI + build type
    // ("app-arm64-v8a-release.apk", "app-universal-release.apk", ...) --
    // meaningless once several of these sit in a Downloads folder next to
    // APKs from other apps. Rename each split's output to "<app
    // name>-<abi-or-universal>.apk" instead, so they're identifiable at a
    // glance. Note: abi/variant below are Groovy variables evaluated by
    // Gradle at build time, NOT this JS template literal -- the ${...}
    // escapes are deliberate so JS leaves them as literal ${...} in the
    // written file instead of trying (and failing) to resolve them as JS
    // variables.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            outputFileName = "KhalifaTopUp-${abi ?: 'universal'}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Lets MainActivity inject the showOpenFilePicker polyfill via
    // WebViewCompat.addDocumentStartJavaScript on devices whose WebView
    // supports it -- a real guarantee the script runs before the page's
    // own scripts, instead of the onPageStarted best-effort fallback
    // (which can't promise it runs first on every device/WebView version).
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    // Native "Sign in with Google" -- AndroidBridge.signInWithGoogle() in
    // MainActivity, backed by Credential Manager (Google's current API,
    // replacing the deprecated GoogleSignInClient/One Tap). This runs the
    // whole flow as a real system bottom sheet outside the WebView, which
    // is required: Google's own OAuth endpoint refuses to complete
    // sign-in *inside* any embedded WebView (it detects the "wv" user
    // agent token and returns disallowed_useragent), no matter how the
    // WebView itself is configured.
    implementation 'androidx.credentials:credentials:1.3.0'
    // Play-services-backed implementation Credential Manager delegates to
    // on real devices -- credentials-1.3.0 alone only provides the API
    // surface, not a working provider.
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    // GetSignInWithGoogleOption + GoogleIdTokenCredential, the
    // Google-specific request/response types layered on top of the
    // generic Credential Manager API above.
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}

// Reads app/google-services.json (see findGoogleServicesJson in server.js)
// and wires this build up as that Firebase project's Android app.
apply plugin: 'com.google.gms.google-services'
