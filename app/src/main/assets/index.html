<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--accent:#5fa4b8;--btn:#8b919c;--text:#fff;--bg1:#0a0a0d;--bg2:#2a2a38;--isl:28,29,38;--alpha:.85;--blur:12px;--radius:28px;--amp:6;--speed:6s;--sh:60px;--cs:48px;--ps:76px;--hs:62px;--cbr:50%;--hbr:30%;--ico:#fff;--pico:#fff;--play:#8b919c;--cbg:transparent}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,var(--bg1) 40%,var(--bg2));color:var(--text);font-family:"Marker Felt","Trebuchet MS",system-ui,sans-serif;font-weight:800;font-variant:small-caps;letter-spacing:.03em;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#fx,#fog{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:0}#fog{z-index:1;display:none}
#bgimg{position:fixed;inset:-24px;z-index:0;background-size:cover;background-position:center;display:none}
#app{position:relative;z-index:2;height:100dvh;display:flex;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(var(--sh) + 14px);transition:padding .3s}
.isl{background:rgba(var(--isl),var(--alpha));border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 12px 28px rgba(0,0,0,.4)}
.btnbg{background:linear-gradient(135deg,color-mix(in srgb,var(--btn) 55%,#000),var(--btn))}
.fl{animation:bob var(--speed) ease-in-out infinite;animation-delay:var(--d,0s)}
body.nofloat .fl{animation:none}
@keyframes bob{50%{translate:0 calc(var(--amp)*-1px)}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
header{display:flex;gap:10px;align-items:center}
.sbar{flex:1;min-width:0;display:flex;align-items:center;height:var(--hs);padding:0 6px 0 16px;border-radius:var(--radius)}
.sbar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:1rem}
.sbar input::placeholder{color:var(--accent);opacity:.8}
.sbar button{font-size:1.2rem;width:40px;height:40px}
input{-webkit-user-select:text;user-select:text}
.chip{background:rgba(255,255,255,.08);padding:8px 12px;border-radius:16px;font-size:.85rem;color:inherit}
.chip.on{background:var(--accent);color:#000}
.sh span{display:flex;gap:12px;align-items:center}
.tx{background:#23242e;border:1px solid #33343f;border-radius:12px;color:#fff;padding:10px;font:inherit;width:55%}
.plr{border-bottom:1px solid #26272f}
.pick2{flex:1;text-align:left;display:block;padding:8px 0}
.pick2 small,.res small{display:block;color:var(--accent);font-weight:400}
.nm2{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #26272f}
.res.sub{padding-left:14px;background:rgba(255,255,255,.03)}
#sd{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 16px + var(--hs) + 10px);max-height:50vh;overflow:auto;z-index:8;display:none;padding:4px 14px 12px;background:rgba(var(--isl),calc(var(--alpha) + .1));font-variant:normal;font-weight:600}
#sd.open{display:block}
.prog,.ctl{transition:opacity .25s,visibility .25s}
body.searching .prog,body.searching .ctl{opacity:0;visibility:hidden;pointer-events:none}
#sd p{color:#aab;margin:8px 0;font-weight:400}
.sd-h{color:var(--accent);font-size:.85rem;margin:12px 0 2px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sd-h span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq{width:var(--hs);height:var(--hs);border-radius:var(--hbr);font-size:1.6rem;flex:none;display:inline-grid;place-items:center}
.stage{flex:1;min-height:0;display:grid;place-items:center}
#cover{width:min(72vw,40vh);aspect-ratio:1;border-radius:calc(var(--radius)*1.2);display:grid;place-items:center;font-size:5rem;background-size:cover;background-position:center;box-shadow:0 20px 50px rgba(0,0,0,.55)}
#cover.art span{display:none}
#cover span{color:var(--accent);opacity:.8}
.info{text-align:center;padding:18px 14px}
#ttl{display:block;font-size:1.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#art{display:block;color:var(--accent);margin-top:4px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{padding:14px 18px 10px}
.times{display:flex;justify-content:space-between;color:var(--accent);font-size:.85rem;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--btn) 40%,#000) var(--p,0%),rgba(255,255,255,.12) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--btn);margin-top:-6px}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--btn)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--btn)}
.ctl{align-self:center;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:999px;max-width:100%;box-sizing:border-box}
.ctl button{flex:0 1 auto;min-width:0;width:var(--cs);height:var(--cs);border-radius:var(--cbr);display:grid;place-items:center;position:relative;color:var(--ico);background:var(--cbg)}
.ctl svg{width:calc(var(--cs)*.54);height:calc(var(--cs)*.54);fill:currentColor}
.ctl .on{color:var(--accent)}
#repeat[data-m="2"]::after{content:"1";position:absolute;font-size:.65rem;right:10px;top:8px}
#play{width:var(--ps);height:var(--ps);margin:0 8px;color:var(--pico);background:linear-gradient(135deg,color-mix(in srgb,var(--play) 55%,#000),var(--play));box-shadow:0 0 24px rgba(140,90,220,.45)}
#play svg{width:calc(var(--ps)*.47);height:calc(var(--ps)*.47)}
/* плейлист */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;border-radius:var(--radius) var(--radius) 0 0;transition:transform .3s;padding-bottom:env(safe-area-inset-bottom);background:rgba(var(--isl),calc(var(--alpha) + .1))}
#sheet.closed{transform:translateY(calc(100% - 60px - env(safe-area-inset-bottom)))}
.sh{display:flex;justify-content:space-between;align-items:center;height:60px;padding:0 20px;color:var(--pl,var(--accent))}
#tog{font-size:.9rem}
#list{list-style:none;margin:0;padding:0;max-height:32vh;overflow-y:auto}
#list li{display:flex;align-items:center;padding:0 8px 0 20px;min-height:64px}
#list li.act{background:linear-gradient(90deg,color-mix(in srgb,var(--pl,var(--accent)) 35%,transparent),transparent)}
#list .pick{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:16px;padding:10px 0}
#list .ic{width:18px;font-size:.8rem}
#list .nm{min-width:0}
#list .nm b,#list .nm i{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .nm i{font-style:normal;color:var(--accent);font-size:.9rem}
#list .d{color:var(--accent);margin:0 8px}
#list .x{width:44px;height:44px;font-size:1.6rem;opacity:.8}
.none{justify-content:center;color:var(--accent);padding:20px}
/* окна */
.modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.modal.open{display:flex}
.panel{width:100%;max-height:88dvh;overflow:auto;background:#15161c;border-radius:28px 28px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);font-variant:normal;font-weight:600}
#first{align-items:center;padding:20px}#first .panel{border-radius:28px;text-align:center}
.panel h2{margin:0 0 6px;font-size:1.2rem}
.panel h3{margin:18px 0 6px;color:var(--accent);font-size:.95rem}
.panel p{color:#aab;margin:6px 0 16px;line-height:1.4}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:42px}
.row input[type=range]{width:55%}
.row input[type=color]{width:48px;height:34px;border:0;background:none;padding:0}
.row input[type=checkbox]{width:44px;height:24px;accent-color:var(--accent);transform:scale(1.3)}
.big{display:block;width:100%;padding:14px;border-radius:16px;margin-top:10px;color:#fff;font-weight:700;background:#2b2d3a}
.big.main{background:linear-gradient(135deg,#6a5acd,#8a6fe0)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);translate:-50% 0;z-index:30;background:#000c;padding:10px 18px;border-radius:20px;font-size:.9rem;display:none}
/* строки результатов в виде списка треков */
.res.tr{gap:8px}.res.tr .pl{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--pico);font-size:.95rem;background:linear-gradient(135deg,color-mix(in srgb,var(--play) 55%,#000),var(--play)) center/cover;text-shadow:0 1px 4px #000}
.res.tr .nm2 b{display:block;overflow:hidden;text-overflow:ellipsis}.res.tr .du{color:var(--accent);font-size:.8rem;font-variant-numeric:tabular-nums;flex:none}
.res.tr .chip{padding:8px 10px}
#glow{grid-area:1/1;width:min(72vw,40vh);aspect-ratio:1;border-radius:calc(var(--radius)*1.2);display:none;pointer-events:none;transform:scale(1.04);filter:blur(calc(var(--gs)*.7 + 6px));opacity:var(--gi);
  background:conic-gradient(from var(--ga,0deg),var(--g1,#5fa4b8),var(--g2,#c06bff),var(--g1,#5fa4b8));animation:gspin var(--gsp,8s) linear infinite}
#cover{grid-area:1/1}
@property --ga{syntax:'<angle>';initial-value:0deg;inherits:false}
body.glow #glow{display:block;box-shadow:0 0 var(--gs) calc(var(--gs)*.25) color-mix(in srgb,var(--g1) 60%,transparent)}
body.glowrb #glow{background:conic-gradient(from var(--ga,0deg),#f33,#fa0,#ee3,#3d6,#3cf,#76f,#f3c,#f33)}
body.gpulse #glow{animation:gspin var(--gsp,8s) linear infinite,gpulse 1.6s ease-in-out infinite}
@keyframes gspin{to{--ga:360deg}}@keyframes gpulse{50%{scale:1.08;opacity:calc(var(--gi)*.55)}}
.info{cursor:pointer}
/* горизонтальный формат: слева обложка, справа управление */
@media (orientation:landscape) and (min-aspect-ratio:13/10){
  #app{--cs:42px;--ps:62px;--hs:50px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-rows:auto minmax(0,1fr) auto auto;gap:8px 20px;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(var(--sh) + 8px);overflow:hidden}
  #app>header{grid-column:1/-1}
  .stage{grid-column:1;grid-row:2/5;min-height:0}
  .info{grid-column:2;grid-row:2;align-self:end;padding:8px 12px}
  .prog{grid-column:2;grid-row:3;padding:6px 16px 2px}
  .ctl{grid-column:2;grid-row:4;justify-self:stretch;padding:6px 10px;gap:2px}
  #play{margin:0 4px}
  #cover,#glow{width:min(36vw,max(110px,calc(100dvh - 160px)))}
}
.sel{display:none;width:22px;height:22px;flex:none;accent-color:var(--play)}body.selmode .sel{display:inline-block}

const nrm = s => (s || '').toLowerCase().replace(/ё/g, 'е').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
/* ===== Поиск музыки (Audius API: полные треки, ключ не нужен) ===== */
const lat = s => nrm(s).replace(/[а-я]/g, c => TR[c]);
function copyTxt(t) {
  const done = () => toast('Скопировано: ' + t), fb = () => { const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0'; document.body.append(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Не удалось скопировать'); } a.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fb); else fb();
}

/* сохранение в библиотеку плеера */
/* трек уже в библиотеке плеера */
async function saveItem(it) { return it.rec; }
function plPick(its, row) {
  const old = row.nextElementSibling; if (old && old.className === 'pp') { old.remove(); return; }
  const p = document.createElement('div'); p.className = 'pp'; p.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;align-items:center';
  const put = async pl => {
    let n = 0, err = '';
    for (const it of its) {
      try { const r = await saveItem(it); if (!pl.ids.includes(r.id)) pl.ids = [...pl.ids, r.id]; n++; if (its.length > 1) toast('Сохраняю ' + n + ' из ' + its.length + '…'); }
      catch (e) { err = e === 'quota' ? 'Не хватило места для сохранения' : 'Не удалось добавить часть треков'; if (e === 'quota') break; }
    }
    if (n) { await savePl(pl); render(); toast('Добавлено в «' + pl.name + '»: ' + n); p.remove(); }
    if (err) toast(err);
  };
  playlists.forEach(pl => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = pl.emoji + ' ' + pl.name; b.onclick = () => put(pl); p.append(b); });
  const i = document.createElement('input'); i.className = 'tx'; i.placeholder = 'Новый плейлист'; i.style.width = '42%';
  const n = document.createElement('button'); n.className = 'chip'; n.textContent = '＋ Создать';
  n.onclick = async () => { const nm = i.value.trim(); if (!nm) return; const d = { name: nm.slice(0, 30), emoji: '🎶', color: '#8a6fe0', ids: [] }; d.id = await savePl(d); playlists.push(d); put(d); };
  p.append(i, n); row.after(p);
}

/* результаты */
function mkRes(title, artist, label, fn, cls) {
  const r = document.createElement('div'); r.className = cls || 'res';
  r.innerHTML = '<div class="nm2"><b></b><small></small></div><button class="chip"></button>';
  r.querySelector('b').textContent = title; r.querySelector('small').textContent = artist;
  const b = r.querySelector('button'); b.textContent = label; b.onclick = () => fn(b); return r;
}
function addItem(box, it) {
  const r = document.createElement('div'); r.className = 'res tr';
  r.innerHTML = '<button class="pl" aria-label="Слушать">▶</button><div class="nm2"><b></b><small></small></div><span class="du"></span>';
  r.querySelector('b').textContent = it.title; r.querySelector('small').textContent = it.artist; r.querySelector('.du').textContent = it.dur ? fmt(it.dur) : '';
  const pl = r.querySelector('.pl'); if (it.cover) pl.style.backgroundImage = `linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),url("${it.cover}")`;
  pl.onclick = it.play;
  const sc = document.createElement('input'); sc.type = 'checkbox'; sc.className = 'sel'; sc.setAttribute('aria-label', 'Выбрать');
  sc.onchange = () => { sc.checked ? picked.add(it) : picked.delete(it); sd.upd && sd.upd(); }; r.prepend(sc);
  [['⧉', 'Копировать название и автора', () => copyTxt((it.artist ? it.artist + ' — ' : '') + it.title)], ['＋', 'В плейлист', () => plPick([it], r)]].forEach(([t, l, f]) => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = t; b.setAttribute('aria-label', l); b.onclick = () => f(b); r.append(b);
  });
  box.append(r);
}
const picked = new Set();
function bulkBar() {
  picked.clear(); document.body.classList.remove('selmode');
  const bar = document.createElement('div'); bar.className = 'sd-h'; bar.style.cssText = 'gap:6px;flex-wrap:wrap';
  const mk = (t, f) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = t; b.onclick = () => f(b); bar.append(b); return b; };
  const upd = () => { add.textContent = '＋ В плейлист (' + picked.size + ')'; }; sd.upd = upd;
  const tg = mk('☑ Выбрать несколько', b => {
    const on = document.body.classList.toggle('selmode'); b.textContent = on ? '✕ Отменить выбор' : '☑ Выбрать несколько'; all.style.display = add.style.display = on ? '' : 'none';
    if (!on) { picked.clear(); sd.querySelectorAll('.sel').forEach(c => { c.checked = false; }); upd(); }
  });
  const all = mk('Выбрать все', () => sd.querySelectorAll('.sel').forEach(c => { if (!c.checked) { c.checked = true; c.onchange(); } }));
  const add = mk('', () => { if (!picked.size) { toast('Отметьте треки галочками'); return; } plPick([...picked], bar); });
  all.style.display = add.style.display = 'none'; upd(); sd.append(bar);
}
function section(title) {
  const h = document.createElement('div'); h.className = 'sd-h'; h.textContent = title;
  const box = document.createElement('div'); sd.append(h, box); return box;
}
function openSd(title) {
  const tok = ++sTok; sd.innerHTML = ''; sd.classList.add('open'); document.body.classList.add('searching'); sd.scrollTop = 0;
  const top = document.createElement('div'); top.className = 'sd-h'; top.innerHTML = '<span></span><button class="chip">✕ Закрыть</button>';
  top.firstChild.textContent = title; top.lastChild.onclick = closeSd; sd.append(top); return tok;
}
/* поиск по плееру: треки библиотеки и плейлисты */
function runSearch(q) {
  openSd('Результаты: ' + q); bulkBar();
  const w = lat(q).split(' ').filter(Boolean), hit = txt => w.every(x => lat(txt).includes(x));
  const rank = t => { const a = lat(t.title || t.file || ''), b = lat(t.artist || ''); return (a.startsWith(w[0]) ? 0 : b.startsWith(w[0]) ? 1 : a.includes(w[0]) ? 2 : 3); };
  const found = tracks.filter(t => hit((t.title || '') + ' ' + (t.artist || '') + ' ' + (t.file || ''))).sort((a, b) => rank(a) - rank(b));
  const pls = playlists.filter(x => hit(x.name || ''));
  if (pls.length) {
    const box = section('Плейлисты (' + pls.length + ')');
    pls.forEach(x => box.append(mkRes((x.emoji || '🎶') + ' ' + x.name, x.ids.length + ' треков', 'Открыть', () => { closeSd(); setPl(x); })));
  }
  if (!found.length && !pls.length) { const box = section('Ничего не найдено'); box.innerHTML = '<p>В плеере нет подходящих треков. Проверьте название или добавьте музыку кнопкой «+».</p>'; return; }
  if (found.length) {
    const box = section('Треки (' + found.length + ')');
    found.forEach(t => {
      if (!t._cu && t.cover) t._cu = URL.createObjectURL(t.cover);
      addItem(box, { key: 'l' + t.id, rec: t, title: t.title || t.file, artist: t.artist || '', dur: t.dur || 0, cover: t._cu || '', play: () => { const i = tracks.indexOf(t); if (i >= 0) { load(i, true); closeSd(); } } });
    });
  }
}
$('q').oninput = () => {
  clearTimeout(sTimer); const v = $('q').value.trim();
  if (!v) { closeSd(); return; }
  sTimer = setTimeout(() => runSearch(v), 150);
};
$('sf').onsubmit = e => { e.preventDefault(); clearTimeout(sTimer); const v = $('q').value.trim(); if (v) { $('q').blur(); runSearch(v); } };
document.addEventListener('pointerdown', e => { if (sd.classList.contains('open') && !sd.contains(e.target) && !$('sf').contains(e.target)) closeSd(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSd(); });

const closeFirst = () => { $('first').classList.remove('open'); P.first = 1; saveP(); };
if ('showDirectoryPicker' in window) $('fDir').style.display = 'block';
$('fFiles').onclick = () => { closeFirst(); $('file').click(); };
$('fNo').onclick = closeFirst;
$('fDir').onclick = async () => {
  closeFirst();
  try {
    const h = await showDirectoryPicker(), fs = [];
    (async function walk(d) { for await (const [n, e] of d.entries()) { if (e.kind === 'file') { if (AUDIO_RE.test(n)) fs.push(await e.getFile()); } else await walk(e); } })(h)
      .then(() => addFiles(fs));
  } catch (e) {}
};

/* ===== Приложение (APK): системный выбор нескольких файлов и папки ===== */
const nativePick = !!(window.AndroidMedia && AndroidMedia.pickFiles);
function openPicker() { nativePick ? AndroidMedia.pickFiles() : $('file').click(); }
window.__picked = async list => {
  for (let i = 0; i < list.length; i += 4) {
    const fs = [];
    for (const x of list.slice(i, i + 4)) { try { const b = await (await fetch(x.u)).blob(); fs.push(new File([b], x.n, { type: x.t || b.type })); } catch (e) {} }
    if (fs.length) await addFiles(fs);
  }
};
if (nativePick) {
  $('add').onclick = () => { $('first').querySelector('h2').textContent = 'Добавить треки'; $('first').classList.add('open'); };
  $('fFiles').onclick = () => { closeFirst(); AndroidMedia.pickFiles(); };
  $('fDir').style.display = 'block'; $('fDir').onclick = () => { closeFirst(); AndroidMedia.pickFolder(); };
}
