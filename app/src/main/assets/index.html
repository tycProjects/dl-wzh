<script>
/* Native save bridge for the Android app (window.AndroidStudio). Does nothing in a normal browser. */
(function(){
  var A = window.AndroidStudio;
  if (!A || window.STUDIO_NATIVE) return;
  var pend = {};
  window.__studioSaveReady = function(id, status){ var f = pend[id]; if (f) { delete pend[id]; f(status); } };
  window.STUDIO_NATIVE = {
    saveAs: function(name, blob){
      return new Promise(function(resolve){
        var id = A.openSave(name, blob.type || 'application/octet-stream');
        pend[id] = function(status){
          if (status !== 'ok') return resolve(status === 'cancel' ? 'cancel' : false);
          var CH = 1048576, off = 0;
          function next(){
            if (off >= blob.size) { A.closeSave(id); return resolve(true); }
            var part = blob.slice(off, off + CH); off += CH;
            var fr = new FileReader();
            fr.onload = function(){ var s = fr.result; A.writeChunk(id, s.substring(s.indexOf(',') + 1)); next(); };
            fr.onerror = function(){ A.closeSave(id); resolve(false); };
            fr.readAsDataURL(part);
          }
          next();
        };
      });
    }
  };
})();
</script>

<script>

 clips.forEach(c=>{const bg=c.type==='slot'?'':c.type==='img'?c.el.src:c.el.th;h+=`<div class="clip${c.id===sel?' sel':''}${c.type==='slot'?' slot':''}" data-id="${c.id}" style="left:${pad+c.start*pps}px;width:${c.dur*pps}px;${bg?`background-image:url(${bg})`:''}"><i>${c.dur.toFixed(1)}s</i>${marks(c)}${c.id===sel?'<div class="hd" data-id="'+c.id+'"></div>':''}</div>`});

 if(c&&c.type==='vid'){const el=c.el,still=c.fr!=null||c.rv,sp1=c.sp||1,want=c.fr!=null?c.fr:c.rv?c.in+Math.max(0,c.dur-Math.min(t-c.start,c.dur))*sp1:c.in+Math.min(t-c.start,c.dur)*sp1;el.playbackRate=sp1;av(el,c.vol==null?1:c.vol,muted||still);

 if(t>=T){t=T;sync();draw();tl.scrollLeft=t*pps;pause();if(EXP)endExport();return}
 sync();draw();if(EXP&&expTrack&&expTrack.requestFrame)try{expTrack.requestFrame()}catch(e){}tl.scrollLeft=t*pps;ui();if(EXP)expProg();if(EXP)setTimeout(()=>loop(performance.now()),Math.max(1,1000/XS.fps-4));else requestAnimationFrame(loop)}

const idb=new Promise(r=>{setTimeout(()=>r(null),3000);try{const q=indexedDB.open('studio',2);q.onupgradeneeded=()=>{const d=q.result,n=d.objectStoreNames;if(!n.contains('p'))d.createObjectStore('p',{keyPath:'id'});if(!n.contains('m'))d.createObjectStore('m',{keyPath:'id'});if(!n.contains('f'))d.createObjectStore('f',{keyPath:'id'})};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
