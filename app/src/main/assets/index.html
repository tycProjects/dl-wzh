<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LONG SUPRA // MOD LAB</title>
<style>
:root{--ac:#ff3030;--bg:#05060c;--bd:rgba(255,255,255,.1);--tx:#f4f6fc;--mu:#8d96b0;--r:24px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fl1{to{transform:translate(40px,30px)}}@keyframes fl2{to{transform:translate(-50px,-40px)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes blink{50%{opacity:0}}
.aur{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.aur i{position:absolute;border-radius:50%;filter:blur(90px);background:var(--ac)}
.aur i:nth-child(1){width:360px;height:360px;left:50%;top:-170px;margin-left:-180px;opacity:.2;animation:fl1 9s ease-in-out infinite alternate}
.aur i:nth-child(2){width:300px;height:300px;right:-150px;bottom:12%;opacity:.12;animation:fl2 11s ease-in-out infinite alternate}
.aur i:nth-child(3){width:260px;height:260px;left:-140px;top:42%;background:#3b82f6;opacity:.1}

/* ===== HEADER ===== */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(5,6,12,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--bd)}
.lgw{position:relative;width:42px;height:42px;flex:none;display:grid;place-items:center}
.lgw::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ac),transparent 60%,var(--ac));animation:spin 4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 18px,#000 19px);mask:radial-gradient(circle,transparent 18px,#000 19px);filter:drop-shadow(0 0 6px var(--ac))}
.hl{width:32px;height:32px;border-radius:50%;object-fit:cover}
.brand{flex:1;line-height:1.15;min-width:0}.brand b{display:block;font-weight:900;letter-spacing:3px;font-size:14px;white-space:nowrap}.brand span{color:var(--ac);font-weight:800;letter-spacing:4px;font-size:9px}
.ver{padding:4px 8px;border-radius:99px;font:900 9px system-ui;letter-spacing:1.5px;color:#0a0a10;background:linear-gradient(135deg,#fff,var(--ac));box-shadow:0 0 14px -2px var(--ac)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--bd);font-size:10px;font-weight:800;letter-spacing:1px;color:var(--mu);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--mu)}.chip.ok{color:#3ddc84}.chip.ok i{background:#3ddc84;box-shadow:0 0 8px #3ddc84}.chip.no{color:#ff6b6b}.chip.no i{background:#ff6b6b}

/* ===== LAYOUT ===== */
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 16px calc(112px + env(safe-area-inset-bottom,0px))}
#view>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
#view>*:nth-child(2){animation-delay:.05s}#view>*:nth-child(3){animation-delay:.1s}#view>*:nth-child(4){animation-delay:.15s}#view>*:nth-child(5){animation-delay:.2s}#view>*:nth-child(n+6){animation-delay:.25s}
.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.022));border:1px solid var(--bd);border-radius:var(--r);margin-bottom:14px;overflow:hidden;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 16px 36px -22px #000}
.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);pointer-events:none}
.card>h3{margin:0;padding:16px 18px 8px;font-size:11px;font-weight:800;letter-spacing:2.5px;color:var(--mu);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card>h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.pad{padding:14px 18px}
.row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid rgba(255,255,255,.06)}
.card>h3+.row,.card>.row:first-child{border-top:0}
.ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:18px;background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px var(--bd),0 0 16px -8px var(--ac);color:var(--ac);flex:none;font-weight:800}
.tx{flex:1;min-width:0}.tx b{display:block;font-weight:700}.tx small{display:block;color:var(--mu);font-size:12px;margin-top:1px}
.go{color:var(--mu);font-size:20px}
.note{color:var(--mu);font-size:12px;padding:0 18px 14px;line-height:1.5}
.wm{text-align:center;color:var(--mu);font-size:10px;letter-spacing:2px;opacity:.55;margin-top:8px}

/* ===== CONTROLS ===== */
.sw{width:50px;height:30px;border-radius:15px;background:#222838;border:1px solid var(--bd);position:relative;flex:none;transition:.25s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfd5e6;transition:.25s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--ac);border-color:transparent;box-shadow:0 0 18px -2px var(--ac)}.sw.on::after{left:23px;background:#fff}
.btn{border:0;border-radius:99px;padding:10px 16px;font-weight:900;font-size:12px;letter-spacing:1px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0)),var(--ac);color:#0a0a10;box-shadow:0 8px 20px -8px var(--ac);transition:transform .15s}
.btn:active{transform:scale(.95)}
.ghost{width:calc(100% - 36px);margin:4px 18px 16px;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:14px;padding:12px;font-weight:700;color:var(--mu)}
.seg{display:flex;background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:99px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px 4px;border-radius:99px;font-weight:800;font-size:13px;transition:.2s}
.seg button.on{background:var(--ac);color:#0a0a10;box-shadow:0 6px 16px -6px var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px 14px}
.cp{border:1px solid var(--bd);background:rgba(255,255,255,.05);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;transition:.2s}
.cp.on{border-color:var(--ac);color:var(--ac);background:rgba(255,255,255,.08);box-shadow:0 0 16px -6px var(--ac) inset,0 0 14px -8px var(--ac)}
.lb{display:flex;justify-content:space-between;padding:10px 18px 2px;color:var(--mu);font-size:12px;font-weight:700}.lb b{color:var(--tx)}
.sws{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:6px 18px 12px}
.s{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.25);padding:0}.s.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
input[type=text],input[type=number],input[type=password],textarea{background:rgba(0,0,0,.4);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:11px 13px;font:inherit;width:100%;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,255,255,.05),0 0 18px -6px var(--ac)}
.sws input{width:96px;padding:7px 10px;font-size:12px}textarea{height:70px;resize:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:calc(100% - 36px);margin:8px 18px 12px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--ac);box-shadow:0 0 14px var(--ac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 18px}
.two label{color:var(--mu);font-size:12px;font-weight:700}.two input{font:800 22px ui-monospace,Menlo,monospace;text-align:center;margin-top:5px}
details{border-top:1px solid rgba(255,255,255,.06)}summary{list-style:none;padding:16px 18px;font-weight:800;letter-spacing:2px;font-size:12px;color:var(--ac);display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}summary::after{content:"＋"}details[open] summary::after{content:"－"}

/* ===== HOME ===== */
.hero{text-align:center;padding:24px 16px 18px}
.dial{position:relative;width:236px;height:236px;margin:0 auto 14px}
.dial::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px dashed rgba(255,255,255,.16);animation:spin 40s linear infinite}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);position:relative}
.tick{fill:none;stroke:rgba(255,255,255,.22);stroke-width:5;stroke-dasharray:1.5 9.5}
.trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:10}.prg{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;stroke-dasharray:540.4;stroke-dashoffset:540.4;transition:stroke-dashoffset .5s;filter:drop-shadow(0 0 9px var(--ac))}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dc b{font:900 64px/1 ui-monospace,Menlo,monospace;letter-spacing:-2px;background:linear-gradient(180deg,#fff 30%,var(--ac) 150%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.dc span{color:var(--ac);font-weight:900;letter-spacing:6px;font-size:12px;margin-top:4px;text-shadow:0 0 12px var(--ac)}
.pills,.strip{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.strip{margin:-2px 0 14px}
.banner{display:none;align-items:center;gap:12px;padding:13px 16px;margin-bottom:14px;border-radius:var(--r);background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.4)}
.banner .tx b{color:#ff8a8a}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{position:relative;padding:16px;border-radius:22px;text-align:left;border:1px solid var(--bd);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));transition:.25s;min-height:138px;display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden}
.tile i{font-style:normal;font-size:24px;color:var(--ac);width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--bd)}
.tile b{font-weight:800;margin-top:8px}.tile small{color:var(--mu);font-size:11px}
.tile .ed{margin-top:auto;align-self:flex-start;background:none;border:0;color:var(--ac);font:800 10px system-ui;letter-spacing:1px;padding:8px 0 0}
.tile::after{content:"";position:absolute;top:16px;right:16px;width:10px;height:10px;border-radius:50%;background:#2b3144}
.tile.on{border-color:var(--ac);background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));box-shadow:0 0 30px -12px var(--ac) inset,0 14px 30px -16px var(--ac)}
.tile.on i{background:var(--ac);color:#0a0a10;box-shadow:0 0 20px -2px var(--ac)}
.tile.on::after{background:var(--ac);box-shadow:0 0 12px var(--ac)}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;gap:14px;min-height:80px}.tile.wide i{font-size:22px}.tile.wide b{margin-top:0}.tile.wide small{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:18px;padding:13px 4px;text-align:center}
.stat b{display:block;font:800 17px ui-monospace,Menlo,monospace}.stat span{color:var(--mu);font-size:10px;letter-spacing:2px}

/* ===== EDITOR ===== */
.dot{width:40px;height:40px;border-radius:50%;border:3px solid transparent;background-clip:padding-box;box-shadow:0 0 0 1px var(--bd)}
.dot.on{border-color:#fff;box-shadow:0 0 16px var(--c)}
.dots{display:flex;gap:12px;flex-wrap:wrap;padding:6px 18px 18px}
.dock{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:15;display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:8px 12px;border:1px solid var(--bd);border-radius:22px;background:rgba(10,13,22,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.dock .stage{flex:1;min-height:56px;padding:8px;border-radius:14px;overflow:hidden}
.stage{display:flex;align-items:center;justify-content:center;min-height:96px;padding:18px;background:repeating-conic-gradient(rgba(255,255,255,.035) 0 25%,transparent 0 50%) 0 0/18px 18px}
.pv{display:inline-block;white-space:pre;text-align:center;font-family:ui-monospace,Menlo,monospace}
.fl{position:fixed;z-index:99;display:none;white-space:pre;text-align:center;font-family:ui-monospace,Menlo,monospace;touch-action:none;user-select:none}
.gr{display:block;width:100%;height:14px;margin-top:2px}
.scr{position:relative;height:110px;margin:6px 18px 14px;border:2px solid rgba(255,255,255,.18);border-radius:18px;background:rgba(0,0,0,.4)}
.scr::after{content:"MÀN HÌNH GAME";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.16);font-size:10px;font-weight:800;letter-spacing:3px}
.cn{position:absolute;z-index:2;width:40px;height:16px;border-radius:8px;border:0;background:rgba(255,255,255,.26)}.cn.on{background:var(--ac);box-shadow:0 0 14px var(--ac)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 18px 16px}
.game{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--bd);text-align:left;font-weight:700;font-size:12px}
.game i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:900;color:#0a0a10;background:var(--ac);flex:none}

/* ===== REC ===== */
.rtime{font:900 48px/1 ui-monospace,Menlo,monospace;margin:14px 0 18px;text-shadow:0 0 20px var(--ac)}
.rbtn{width:100px;height:100px;border-radius:50%;border:4px solid rgba(255,255,255,.22);background:#12080b;position:relative;padding:0;transition:.25s}
.rbtn span{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:#ff2d3d;box-shadow:0 0 26px #ff2d3d;transition:.25s}
.rbtn.on{border-color:var(--ac);box-shadow:0 0 36px -4px var(--ac)}.rbtn.on span{width:34px;height:34px;border-radius:9px}
.rinfo{color:var(--mu);font-size:11px;margin-top:14px;word-break:break-all;padding:0 14px}

/* ===== NAV ===== */
nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 24px);max-width:540px;z-index:30;display:flex;gap:2px;padding:6px;border-radius:30px;background:rgba(14,17,28,.8);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--bd);box-shadow:0 20px 44px -12px #000}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border:0;border-radius:24px;background:transparent;color:var(--mu);font-size:9px;font-weight:800;letter-spacing:.5px;white-space:nowrap;transition:.25s}
nav button svg{width:21px;height:21px}
nav button.on{color:#0a0a10;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0)),var(--ac);box-shadow:0 8px 22px -6px var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:200;background:rgba(24,28,44,.95);border:1px solid var(--bd);padding:11px 18px;border-radius:99px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center;box-shadow:0 12px 30px -8px #000}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== GATE: màn hình kích hoạt (thay đăng nhập) ===== */
#gate{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(26px + env(safe-area-inset-bottom,0px));background:#04050a;overflow:hidden;transition:transform .75s cubic-bezier(.7,0,.2,1),opacity .75s,filter .75s}
#gate.open{transform:scale(1.4);opacity:0;filter:blur(16px);pointer-events:none}
.g-bg{position:absolute;inset:0;pointer-events:none}
.g-bg::before{content:"";position:absolute;left:50%;top:32%;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:var(--ac);opacity:.24;filter:blur(100px)}
.g-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:34px 34px;-webkit-mask:radial-gradient(circle at 50% 38%,#000 5%,transparent 72%);mask:radial-gradient(circle at 50% 38%,#000 5%,transparent 72%)}
.g-scan{position:absolute;left:0;right:0;height:140px;top:-140px;background:linear-gradient(transparent,rgba(255,255,255,.07),transparent);animation:gscan 4.5s linear infinite;pointer-events:none}
@keyframes gscan{to{top:100%}}
.g-top{position:relative;width:100%;display:flex;justify-content:space-between;font:800 10px system-ui;letter-spacing:3px;color:var(--mu)}
.g-top b{color:var(--ac)}
.g-mid{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.rad{position:relative;width:216px;height:216px;display:grid;place-items:center;margin-bottom:22px}
.rad>*{position:absolute;border-radius:50%}
.rad .r1{inset:0;border:1px dashed rgba(255,255,255,.22);animation:spin 26s linear infinite}
.rad .r2{inset:12px;background:conic-gradient(var(--ac),transparent 40%,transparent 60%,var(--ac));-webkit-mask:radial-gradient(circle,transparent 94px,#000 95px);mask:radial-gradient(circle,transparent 94px,#000 95px);animation:spin 3s linear infinite;filter:drop-shadow(0 0 8px var(--ac))}
.rad .r3{inset:30px;border:2px solid transparent;border-top-color:var(--ac);border-bottom-color:var(--ac);animation:spin 5s linear infinite reverse;opacity:.8}
.rad .sw2{inset:16px;background:conic-gradient(var(--ac),transparent 28%);opacity:.28;-webkit-mask:radial-gradient(circle,transparent 62px,#000 63px);mask:radial-gradient(circle,transparent 62px,#000 63px);animation:spin 2.4s linear infinite}
.rad img{position:relative;width:118px;height:118px;object-fit:cover;box-shadow:0 0 36px var(--ac),0 0 0 3px rgba(255,255,255,.12);animation:gpulse 2.6s ease-in-out infinite}
@keyframes gpulse{50%{box-shadow:0 0 54px var(--ac),0 0 0 3px rgba(255,255,255,.2)}}
.gl{position:relative;margin:0;padding-left:8px;font:900 36px/1 system-ui;letter-spacing:8px;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.25)}
.gl::before,.gl::after{content:attr(data-t);position:absolute;left:8px;top:0;width:100%;overflow:hidden}
.gl::before{color:var(--ac);clip-path:inset(0 0 58% 0);animation:gl1 3.2s infinite steps(1)}
.gl::after{color:#00e5ff;clip-path:inset(58% 0 0 0);animation:gl2 3.2s infinite steps(1)}
@keyframes gl1{0%,88%,100%{transform:none}90%{transform:translate(-4px,1px)}94%{transform:translate(3px,-1px)}}
@keyframes gl2{0%,90%,100%{transform:none}92%{transform:translate(4px,-1px)}96%{transform:translate(-3px,1px)}}
.g-sub{margin-top:12px;padding:5px 16px;border:1px solid var(--ac);border-radius:99px;color:var(--ac);font:800 12px system-ui;letter-spacing:6px;padding-left:22px;background:rgba(255,255,255,.04);box-shadow:0 0 20px -8px var(--ac)}
.g-log{position:relative;width:100%;max-width:340px;padding:10px 14px;border-left:2px solid var(--ac);border-radius:4px 14px 14px 4px;background:rgba(255,255,255,.04);font:600 11px/1.9 ui-monospace,Menlo,monospace;color:var(--mu)}
.g-log .ln{display:flex;justify-content:space-between;gap:10px;opacity:0;animation:up .5s forwards}
.g-log .ln:nth-child(1){animation-delay:.3s}.g-log .ln:nth-child(2){animation-delay:.7s}.g-log .ln:nth-child(3){animation-delay:1.1s}.g-log .ln:nth-child(4){animation-delay:1.5s}
.g-log b{font-weight:800;color:var(--tx)}.g-log b.ok{color:#3ddc84}.g-log b.no{color:#ff8a8a}
.g-log .cur::after{content:"_";color:var(--ac);animation:blink 1s infinite}
.g-bot{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.hold{position:relative;width:128px;height:128px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s,box-shadow .3s}
