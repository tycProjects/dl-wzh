const nCol=n=>NCOL[n.color>=0&&n.color<NCOL.length?n.color:0][0];
function nSave1(n){n.upd=Date.now();commit([['notes','put',n]])}
function nDateLbl(d){const t=today(),y=dstr(Date.now()+864e5);return d==t?'আজ':d==y?'আগামীকাল':new Date(d+'T00:00:00').toLocaleDateString('bn-BD',{day:'numeric',month:'short'})}
function nCard(n){const c=nCol(n),it=nItems(n),[d,t]=nProg(n),du=nDue(n),sh=it.slice(0,3),pc=t?Math.round(d/t*100):0,L=n.type=='list';

(function(){let t=null,x0=0,y0=0,lp=0;

['pointerup','pointercancel'].forEach(k=>document.addEventListener(k,stop));

})();
const tbd=n=>Number(n).toLocaleString('bn-BD',{maximumFractionDigits:2});
const tnum=id=>{const e=$('#'+id),v=e?parseFloat(String(e.value).replace(/,/g,'')):NaN;return isNaN(v)?0:v};
const tdisp=e=>String(e).replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−').replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
function tEval(e){const pm=e.match(/^(.+[0-9)])([+\-])(\d+\.?\d*)%$/);if(pm){const b=tEval(pm[1]);if(b===null)return null;return Math.round(b*(1+(pm[2]=='+'?1:-1)*pm[3]/100)*1e8)/1e8}let x=e.replace(/(\d+\.?\d*)%/g,'($1/100)').replace(/[+\-*/.]+$/,'');if(!x||!/^[0-9+\-*/.()\s]+$/.test(x))return null;try{const v=Function('"use strict";return ('+x+')')();return isFinite(v)?Math.round(v*1e8)/1e8:null}catch(_){return null}}
function tKey(k){let e=TC.e;const wd=TC.done;if(k!='=')TC.done=null;if(wd&&/^[0-9.]$/.test(k))e='';const last=e.slice(-1);
if(k=='C')e='';else if(k=='⌫')e=e.slice(0,-1);
else if('+-*/'.includes(k)){if(!e)return k=='-'?(TC.e='-',tUI()):0;e=/[+\-*/]$/.test(e)?e.slice(0,-1)+k:e+k}
else if(k=='%'){if(/\d$/.test(e))e+='%'}
else if(k=='.'){const seg=e.split(/[+\-*/%]/).pop();if(seg.includes('.'))return;e+=seg===''?'0.':'.'}
else if(k=='='){const r=tEval(e);if(r===null||!/[+\-*/%]/.test(e.replace(/^-/,'')))return;thAdd(e,r);TC.e=String(r);TC.done={e,r};return tUI()}
else{if(last=='%')e+='*';e+=k}
TC.e=e;tUI(k!='C'&&k!='⌫')}
function tUI(an){const d=$('#t_ex'),r=$('#t_rs');if(!d)return;
if(TC.done){d.innerHTML='<span class="tup">'+esc(tdisp(TC.done.e))+' =</span>';r.innerHTML='<span class="tup2">'+tbd(TC.done.r)+'</span>';r.classList.add('big');return}
r.classList.remove('big');const v=tEval(TC.e),live=v!==null&&/[+\-*/%]/.test(TC.e.replace(/^-/,'')),t=TC.e?tdisp(TC.e):'০';
d.innerHTML=an&&TC.e?esc(t.slice(0,-1))+'<span class="tlc">'+esc(t.slice(-1))+'</span>':esc(t);d.scrollLeft=d.scrollWidth;
r.innerHTML=live?'<span class="tfade">= '+tbd(v)+'</span>':' '}
function tNote(){const v=tEval(TC.e);const rc=thRecent(),lines=rc.slice(0,6).map(x=>tdisp(x.e)+' = '+tbd(x.r));if(v!==null&&TC.e&&!rc.length)lines.push(tdisp(TC.e)+' = '+tbd(v));if(!lines.length)return toast('আগে একটা হিসাব করুন');
commit([['notes','put',{id:uid(),title:'হিসাব '+new Date().toLocaleDateString('bn-BD',{day:'numeric',month:'short'}),type:'text',body:lines.join('\n'),color:2,pin:0,due:'',fin:0,ts:Date.now(),upd:Date.now()}]]);toast('নোটে সেভ হয়েছে ✔')}

/* ---------- 📒 ক্যাশ খাতা: দৈনিক আয়-খরচ + দিন শেষে ক্যাশ মিলানো ---------- */
let cbD='',cbT='in',cbA='',cbN='';

<div class="seg"><button class="${out?'':'on'}" onclick="cbSet('in')">🟢 আয় / জমা</button><button class="${out?'on':''}" onclick="cbSet('out')">🔴 খরচ</button></div>

<div class="glass"><h3>🧾 ${isT?'আজকের':bdDate(d)} এন্ট্রি <span class="k">(${nb(c.L.length)}টি)</span></h3>${c.L.map(x=>`<div class="cbi"><div class="cbic ${x.type}">${x.type=='in'?'↓':'↑'}</div><div class="cbm"><div class="cbn">${esc(x.note||(x.type=='in'?'আয়':'খরচ'))}</div><div class="k">${new Date(x.ts||Date.now()).toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'})}</div></div><b class="${x.type=='in'?'ok':'bad'}">${x.type=='in'?'+':'−'}${fmt(x.amt)}</b><button class="d sm" onclick="cbDel('${x.id}')">✕</button></div>`).join('')||'<div class="k" style="text-align:center;padding:10px 0">এই দিনে কোনো এন্ট্রি নেই</div>'}</div>
<div class="glass"><h3>💵 ক্যাশ মিলান</h3><div class="k" style="margin-bottom:6px">ড্রয়ারে গুনে যত টাকা পেলেন লিখুন — খাতার সাথে মিলিয়ে দেখাবে</div><input id="cb_m" type="number" inputmode="decimal" min="0" step="any" placeholder="ড্রয়ারে আসলে কত টাকা?" oninput="cbMatch()"><div id="cb_r"></div></div>`}
function cbAdd(){const a=parseFloat($('#cb_a').value);if(!(a>0))return toast('টাকার পরিমাণ লিখুন');

let pfOpen=new Set();
function pfFold(){document.querySelectorAll('#app>.glass').forEach(g=>{const h=g.firstElementChild;if(!h||h.tagName!='H3')return;const t=h.textContent.trim();if(/ডেভেলপার|সারসংক্ষেপ/.test(t))return;

d.addEventListener('toggle',()=>{d.open?pfOpen.add(t):pfOpen.delete(t)});g.replaceWith(d)})}

<div id="tbody">${tt=='calc'?tCalc():tt=='profit'?tProfit():tt=='change'?tChange():tt=='cash'?tCash():tWt()}</div>`}

const TDN=[1000,500,200,100,50,20,10,5,2,1];
function tChange(){setTimeout(tCh,0);return `<div class="glass"><label>মোট বিল (৳)</label><input id="tc_b" type="number" inputmode="decimal" min="0" step="any" placeholder="যেমন: ৩৪৫" oninput="tCh()"><label>ক্রেতা দিয়েছে (৳)</label><input id="tc_p" type="number" inputmode="decimal" min="0" step="any" placeholder="যেমন: ৫০০" oninput="tCh()">

if(!pr.name)return toast('আপনার নাম লিখুন');if(!pr.shop)return toast('দোকানের নাম লিখুন');
if(pr.phone&&!okPhone(pr.phone))return toast('ফোন নাম্বার সঠিক নয়');if(pr.phone2&&!okPhone(pr.phone2))return toast('বিকল্প নাম্বার সঠিক নয়');
if(!pr.createdAt)pr.createdAt=Date.now();if(u&&!pr.photo&&u.photoURL)pr.photo=u.photoURL;
try{await saveProfileRemote(pr);if(u&&u.displayName!=pr.name)u.updateProfile({displayName:pr.name}).catch(()=>{});toast('প্রোফাইল সংরক্ষিত ✔');render()}catch(x){toast('সংরক্ষণ ব্যর্থ ('+(x.code||'ত্রুটি')+')')}}
function envCheck(){const ua=navigator.userAgent||'',fl=location.protocol=='file:',iab=/FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|MicroMessenger|Snapchat|; wv\)/i.test(ua);let m='';
if(fl)m='⚠️ ফাইলটা সরাসরি খোলা হয়েছে — এভাবে লগইন চলবে না। হোস্ট করা লিংক (https://…) থেকে খুলুন।';
if(m){const e=$('#au-env');e.textContent=m;e.style.display='block';$('#login').classList.add('nog')}}
envCheck();
function lockLogin(m){$('#lerr').textContent=m;$('#lb').disabled=true}
applyTheme();
/* ---------- সেভ করা লগইন: একবার ঢুকলে লগআউট বা সাইট-ডেটা মোছা পর্যন্ত সরাসরি মূল পেজ ---------- */
const HK='lg',CK='DC';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
function saveCache(){if(!UID)return;clearTimeout(saveCache.h);saveCache.h=setTimeout(()=>{const d={};LOAD.forEach(s=>d[s]=D[s]);lsSet(CK,JSON.stringify({uid:UID,email:UEMAIL,p:PROF,pw:PW?1:0,d}))},300)}
function forgetLogin(){clearTimeout(saveCache.h);lsDel(HK);lsDel(CK)}
function showLogin(){$('#boot').style.display='none';authView(AV=='prof'?'login':AV);$('#login').style.display='flex'}
function bootMsg(m,retry){const e=$('#bootm');if(e)e.textContent=m;const b=$('#bootb');if(b)b.style.display=retry?'flex':'none';const o=$('#bootlo');if(o)o.style.display=lsGet(HK)?'':'none'}
function bootRetry(){location.reload()}
let inst=false;
/* আগে লগইন করা থাকলে নেটওয়ার্কের জন্য অপেক্ষা না করে সেভ করা ডেটা দিয়ে সঙ্গে সঙ্গে মূল পেজ দেখানো হয় */
(function(){const h=lsGet(HK);if(!h)return;try{const c=JSON.parse(lsGet(CK)||'null');if(c&&c.uid==h&&c.d){UID=h;UEMAIL=c.email||'';PROF=c.p||{};PW=c.pw!==0;LOAD.forEach(s=>D[s]=Array.isArray(c.d[s])?c.d[s]:[]);inst=true;render();$('#boot').style.display='none'}}catch(e){inst=false;UID=null}})();
const SAFE=()=>{const m=$('#modal'),a=document.activeElement;return !(m&&m.style.display=='flex')&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))};
async function syncData(){const before=inst?JSON.stringify(LOAD.map(s=>D[s])):null;const snP=rdb.ref('users/'+UID+'/shopName').get().catch(()=>null),pfP=rdb.ref('users/'+UID+'/profile').get().catch(()=>null),lgP=rdb.ref('users/'+UID+'/lang').get().catch(()=>null);let need=false;
try{await loadAll()}catch(e){if(inst)toast('ডেটা আপডেট হয়নি — সেভ করা ডেটা দেখানো হচ্ছে');else{$('#boot').style.display='flex';bootMsg('ডেটা লোড হয়নি ('+(e.code||'ত্রুটি')+')',true)}return}
try{const lg=await lgP;if(lg){const v=lg.exists()&&lg.val()=='en'?'en':'bn';if(v!=S.lang){S.lang=v;saveS();i18Apply(true)}}}catch(e){}
try{const sn=await snP;if(sn&&sn.exists()&&typeof sn.val()=='string'&&sn.val()!=S.shop){S.shop=sn.val();saveS()}}catch(e){}
try{const pf=await pfP;if(pf){if(pf.exists())applyProfile(pf.val());else if(!PROF.createdAt)need=true}}catch(e){}
$('#boot').style.display='none';
const same=before!==null&&before===JSON.stringify(LOAD.map(s=>D[s]));
if(!same){if(!inst||SAFE())render();else toast('নতুন ডেটা এসেছে')}
if(need)showComplete();
inst=false}
async function onAuth(u){
if(!u){forgetLogin();UID=null;UEMAIL='';PROF={};PW=true;PENDING=null;AV='login';S.shop='আমার দোকান';S.phone='';saveS();inst=false;ST.forEach(s=>D[s]=[]);cart=[];tab='board';closeM();$('#lp').value='';showLogin();return}
if(UID&&UID!=u.uid){ST.forEach(s=>D[s]=[]);inst=false}
UID=u.uid;UEMAIL=u.email||'';PW=u.providerData.some(p=>p.providerId=='password');lsSet(HK,UID);
emIndex(UEMAIL);
$('#login').style.display='none';
if(!inst){$('#boot').style.display='flex';bootMsg('লোড হচ্ছে…',false)}
if(PENDING){const pr=Object.assign({email:UEMAIL,createdAt:Date.now()},PENDING);PENDING=null;u.updateProfile({displayName:pr.name}).catch(()=>{});try{await saveProfileRemote(pr)}catch(e){toast('প্রোফাইল সংরক্ষণ হয়নি — প্রোফাইল পেজ থেকে আবার দিন')}}
await syncData()}
const FBU='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
async function ldFb(n){const u=FBU+n+'-compat.js';for(let k=0;k<3;k++){try{await loadJs(u);return}catch(e){await qwait(600*(k+1))}}throw new Error('load')}
async function startAuth(){if(startAuth.on)return;startAuth.on=1;
if(!FIREBASE_CONFIG.apiKey){lockLogin('Firebase কনফিগ বসানো হয়নি — ফাইলের FIREBASE_CONFIG এ আপনার কী বসান');showLogin();return}
if(typeof firebase=='undefined'){try{await ldFb('app');await Promise.all([ldFb('auth'),ldFb('database')])}catch(e){startAuth.on=0;if(inst)toast('অফলাইন — সেভ করা ডেটা দেখানো হচ্ছে');else{$('#boot').style.display='flex';bootMsg('ইন্টারনেট সংযোগ নেই বা ধীর',true)}return}}
firebase.initializeApp(FIREBASE_CONFIG);fa=firebase.auth();rdb=firebase.database();try{rdb.ref('.info/serverTimeOffset').on('value',x=>{SRVOFF=x.val()||0})}catch(x){}setTimeout(()=>{srvGuard('')},300);
fa.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});fa.onAuthStateChanged(onAuth)}
addEventListener('online',()=>{if(!fa)startAuth()});
setTimeout(()=>{const b=$('#boot');if(b&&b.style.display!='none')bootMsg('সংযোগ ধীর — অপেক্ষা করুন অথবা আবার চেষ্টা করুন',true)},10000);
startAuth();
</script></body></html>
