buildscript {
    repositories {
        maven { url = uri('/root/maven/localMvnRepository') }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.0'
    }
}

plugins {
    id 'com.android.application' version '8.11.0' apply false
}
