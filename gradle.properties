# Modest memory so it also builds on a phone (Android Code Studio / AndroidIDE)
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Keep resource file names (res/drawable-nodpi-v4/ic_launcher.png) unshortened in the template APK
android.enableResourceOptimizations=false
android.enableJetifier=true
