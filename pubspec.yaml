name: wzh_apk
description: WZH 2 APK - native Flutter copy of the builder UI
publish_to: 'none'
version: 1.0.0+21

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: '>=2.2.3 <2.4.0'
  path_provider: ^2.1.4
  file_selector: ^1.0.3
  file_picker: ^8.1.2
  archive: ^3.6.1
  url_launcher: ^6.3.0
  crypto: ^3.0.3
  qr: ^3.0.1
  supabase: ^2.3.0
  google_sign_in: ^6.2.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  pointycastle: ^3.9.1
  # 10.x needs win32 6, file_picker 8 needs win32 5: 9.x keeps both on win32 5 (Windows only, unused on Android)
  package_info_plus: ^9.0.1
  photo_manager: ^3.6.4
  open_filex: any
  media_store_plus: any
  flutter_local_notifications: ^19.0.0
  webview_flutter: ^4.10.0
  image: ^4.1.7
  video_compress: ^3.1.3
  video_player: ^2.8.0

dependency_overrides:
  # 2.4+ of the Android implementation uses a Kotlin-coroutine API that crashes at
  # startup (NoSuchMethodError SharedPreferencesApiRegistrar.getAll) in some builds.
  shared_preferences_android: '>=2.3.0 <2.4.0'

flutter:
  uses-material-design: true
  assets:
    - assets/quick/
    - assets/aapt/
    - assets/termux/
    - assets/illustrations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.otf
          weight: 800
