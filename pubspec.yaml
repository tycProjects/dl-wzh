name: wzh_apk
description: WZH 2 APK - native Flutter copy of the builder UI
publish_to: 'none'
version: 1.0.0+21

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: '>=2.2.3 <2.4.0'
  path_provider: ^2.1.4
  file_selector: ^1.0.3
  archive: ^3.6.1
  url_launcher: ^6.3.0
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  package_info_plus: ^10.2.2
  photo_manager: ^3.6.4
  open_filex: any
  media_store_plus: any
  flutter_local_notifications: ^19.0.0
  webview_flutter: ^4.10.0

dependency_overrides:
  # 2.4+ of the Android implementation uses a Kotlin-coroutine API that crashes at
  # startup (NoSuchMethodError SharedPreferencesApiRegistrar.getAll) in some builds.
  shared_preferences_android: '>=2.3.0 <2.4.0'

flutter:
  uses-material-design: true
  assets:
    - assets/quick/
    - assets/aapt/
