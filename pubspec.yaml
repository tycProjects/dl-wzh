name: motion_editor
description: Alight Motion style motion graphics editor (layers, keyframes, timeline, MP4 export)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  ffmpeg_kit_flutter_new: any
  gal: ^2.3.0

flutter:
  uses-material-design: true
