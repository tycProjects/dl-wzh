def localProperties = new File(rootDir, "local.properties")
if (!localProperties.exists()) {
    def sdkDir = System.getenv("ANDROID_SDK_ROOT")
    if (sdkDir) {
        localProperties.write("sdk.dir=$sdkDir")
    }
}

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Stady manager"
include ':app'
