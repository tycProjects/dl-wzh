name: screen_capture_native
description: Native screen recorder engine (MediaProjection + MediaCodec) for Android.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.screencapturenative
        pluginClass: ScreenCapturePlugin
